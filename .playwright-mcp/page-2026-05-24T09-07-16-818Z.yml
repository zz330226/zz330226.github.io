            - listitem [ref=e416]:
              - strong [ref=e417]: 隐私敏感用户
              - text: ：完全本地处理，数据安全
            - listitem [ref=e418]:
              - strong [ref=e419]: 多语言需求
              - text: ：支持中文、英文等23种语言
          - paragraph [ref=e420]: 相比商业产品 ElevenLabs，Voicebox 提供了免费、开源、本地化的替代方案，功能更全面，是 AI 语音工具的最佳选择。

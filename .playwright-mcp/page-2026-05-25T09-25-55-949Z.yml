              - generic [ref=e152]: 前言最近 GitHub 上增长最快的项目之一，colbymchenry/codegraph 以周增速 18,000+ Star 的速度冲上热门。它的核心理念很简单：给 AI 编程助手装一个「语义级代码搜索引擎」，让 Agent 不再盲目读文件，而是直接查询预构建的知识图谱。 本文详细介绍 CodeGraph 的安装、配置和核心用法。 它解决了什么问题？在使用 Claude Code、Cursor、Codex 等 AI 编程助手时，一个常见痛点是： Agent 想修改一个函数，却要先 grep 全文、逐个读取文件，消耗大量 token 和工具调用。 CodeGraph 的解决方案是： 用 Tree-sitter 解析源码，生成抽象语法树（AST） 提取符号关系（调用链、依赖链、路由映射） 存入本地 SQLite + FTS5 全文搜索索引 通过 MCP Server 暴露语义查询接口 结果：Agent 查询一个函数名，直接返回定义位置、调用者、被调用者、影响范围——无需扫描整个项目。 官方基准测试显示： 工具调用减少 71% Token 消耗减少 57% 延迟...
